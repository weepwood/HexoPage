name: 发布历史博客
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml', '.github/pages/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hexopage-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
        id: pages
      - name: 构建固定版本并验证关键产物
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 .github/pages/build-pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
